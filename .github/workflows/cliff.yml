name: Release Drafter (git-cliff)

on:
  push:
    branches:
      - main
      - lts

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Читаем всю историю коммитов и тегов

      - name: Generate Changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --unreleased --bump --github-repo ${{ github.repository }} --github-token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Подготовка версии
      - name: Prepare Tag Name
        id: tag
        run: |
          RAW_VER="${{ steps.git-cliff.outputs.version }}"
          if [[ "$RAW_VER" == v* ]]; then
            echo "version=$RAW_VER" >> $GITHUB_OUTPUT
          else
            echo "version=v$RAW_VER" >> $GITHUB_OUTPUT
          fi

      # Обновление или создание ЕДИНСТВЕННОГО черновика через GitHub CLI
      - name: Create or Update Single Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.version }}
          CHANGELOG_TEXT: ${{ steps.git-cliff.outputs.content }}
        run: |
          # Сохраняем чейнджлог во временный файл
          echo "$CHANGELOG_TEXT" > notes.md

          # Ищем имя тега текущего открытого черновика (исправлено tag_name)
          DRAFT_TAG=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft == true) | .tag_name' | head -n 1)

          if [ -n "$DRAFT_TAG" ]; then
            echo "Обновляем существующий черновик ($DRAFT_TAG) -> перезаписываем/переименовываем в $NEW_TAG..."
            gh release edit "$DRAFT_TAG" --tag "$NEW_TAG" --title "$NEW_TAG" --notes-file notes.md
          else
            echo "Черновиков не найдено. Создаем новый черновик для версии $NEW_TAG..."
            gh release create "$NEW_TAG" --draft --title "$NEW_TAG" --notes-file notes.md
          fi