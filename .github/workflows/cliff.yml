name: Release Drafter

on:
  push:
    branches:
      - main
      - lts

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Читаем всю историю коммитов и тегов

      - name: Generate Changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --bump --github-repo ${{ github.repository }} --github-token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Формируем имя тега с префиксом 'v' (например, v0.1.0 или v1.2.3)
      - name: Prepare Tag Name
        id: tag
        run: |
          RAW_VER="${{ steps.git-cliff.outputs.version }}"
          if [[ "$RAW_VER" == v* ]]; then
            echo "version=$RAW_VER" >> $GITHUB_OUTPUT
          else
            echo "version=v$RAW_VER" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          body: ${{ steps.git-cliff.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}