# Конфигурация git-cliff
# https://git-cliff.org/docs/configuration

[changelog]
# Заголовок списка изменений
header = """
## What's Changed?
"""

# Шаблон генерации текста изменений (Tera template)
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | strip }}\
  {% if commit.github.pr_number %} (#{{ commit.github.pr_number }}){% endif %}\
  {% if commit.github.username %} @{{ commit.github.username }}{% elif commit.author.name %} @{{ commit.author.name }}{% endif %}
{% endfor %}
{% endfor %}
{% if previous.version and version %}
---

**Full Changelog**: [`{{ previous.version }}...{{ version }}`](https://github.com/{{ github.repository }}/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""

footer = ""
trim = true

[git]
# Парсить ли conventional commits (feat, fix и т.д.)
conventional_commits = true
filter_unconventional = false
split_commits = false

# Группировка коммитов (соответствует вашей секции categories из release-drafter)
commit_parsers = [
  # Игнорировать коммиты пропущенных релизов или служебные
  { message = "^chore\\(release\\)", skip = true },
  { message = ".*[Sk|sk]ip [Re|re]lease.*", skip = true },

  # 💥 Breaking Changes
  { body = ".*BREAKING CHANGE.*", group = "💥 Breaking Changes" },
  { message = "^.*!: ", group = "💥 Breaking Changes" },

  # ⭐ Features (Minor)
  { message = "^feat", group = "⭐ Features" },

  # 🐞 Bug Fixes (Patch)
  { message = "^fix", group = "🐞 Bug Fixes" },

  # 🛠 Improvements (Patch)
  { message = "^perf", group = "🛠 Improvements" },
  { message = "^refactor", group = "🛠 Improvements" },
  { message = "^style", group = "🛠 Improvements" },
  { message = "^chore", group = "🛠 Improvements" },

  # 📖 Documentation (Patch)
  { message = "^docs", group = "📖 Documentation" },

  # 🌍 Localization (Patch)
  { message = "^i18n", group = "🌍 Localization" },
  { message = "^loc", group = "🌍 Localization" },

  # 🌀 External Changes
  { message = "^deps", group = "🌀 External Changes" },
  { message = "^build\\(deps\\)", group = "🌀 External Changes" },
  { message = "^chore\\(deps\\)", group = "🌀 External Changes" },
  { message = "^plugin", group = "🌀 External Changes" },

  # Все остальные коммиты отправляем в Improvements по умолчанию
  { message = ".*", group = "🛠 Improvements" },
]

protect_breaking_commits = false
filter_commits = false

# Маска для версий (тегов), например v1.0.0
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""

# Сортировка коммитов внутри групп
sort_commits = "oldest"